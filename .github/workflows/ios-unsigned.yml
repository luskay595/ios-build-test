name: iOS unsigned IPA (test)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XC:-/Applications/Xcode.app}"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx expo prebuild --platform ios --no-install
        env:
          CI: '1'
      - run: cd ios && pod install --repo-update
      - name: Build (non signé)
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          # Le scheme de l'app = le nom de son .xcodeproj (et non un scheme de Pod).
          SCHEME=$(ls -d *.xcodeproj | head -1 | sed 's/\.xcodeproj$//')
          echo "Workspace=$WS  Scheme=$SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" build
      - name: Empaquetage .ipa
        run: |
          APP=$(find ios/build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          echo "App=$APP"
          if [ -z "$APP" ]; then
            echo "Aucun .app trouvé — contenu des Products :"
            find ios/build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qr app-unsigned.ipa Payload)
          ls -la out/app-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: out/app-unsigned.ipa
          if-no-files-found: error
